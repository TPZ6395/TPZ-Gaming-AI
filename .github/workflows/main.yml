name: Build TPZ APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Prepare Crash-Free Android Build
      run: |
        rm -rf src *.gradle *.gradle.kts app/*.gradle app/*.gradle.kts gradle.properties
        printf "android.useAndroidX=true\n" > gradle.properties
        printf 'pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }\ndependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }\nrootProject.name = "TPZ"\ninclude(":app")\n' > settings.gradle.kts
        printf 'plugins { id("com.android.application") version "8.2.2" apply false; id("org.jetbrains.kotlin.android") version "1.9.22" apply false }\n' > build.gradle.kts
        printf 'plugins { id("com.android.application"); id("org.jetbrains.kotlin.android") }\nandroid { namespace = "com.tpz.assistant"; compileSdk = 34; defaultConfig { applicationId = "com.tpz.assistant"; minSdk = 26; targetSdk = 34; versionCode = 3; versionName = "1.2" }; compileOptions { sourceCompatibility = JavaVersion.VERSION_17; targetCompatibility = JavaVersion.VERSION_17 }; kotlinOptions { jvmTarget = "17" } }\ndependencies { implementation("androidx.core:core-ktx:1.12.0"); implementation("androidx.appcompat:appcompat:1.6.1"); implementation("com.google.android.material:material:1.11.0"); implementation("com.squareup.okhttp3:okhttp:4.12.0"); implementation("org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3") }\n' > app/build.gradle.kts
        printf '' | base64 -d > app/src/main/AndroidManifest.xml
        find app/src -name "*.kt" -exec sed -i 's/val plane = image.planes/val plane = image.planes/g; s/startForeground(101, notification)/if (android.os.Build.VERSION.SDK_INT >= 34) startForeground(101, notification, android.content.pm.ServiceInfo.FOREGROUND_SERVICE_TYPE_MEDIA_PROJECTION or android.content.pm.ServiceInfo.FOREGROUND_SERVICE_TYPE_MICROPHONE) else startForeground(101, notification)/g; s/super.onCreate(savedInstanceState)/super.onCreate(savedInstanceState); try {/g; s/setContentView(layout)/setContentView(layout) } catch (e: Exception) { setContentView(TextView(this).apply { text = "Error: " + e.message }) }/g' {} +
    - uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
    - uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.4'
        build-scan-publish: false
    - run: gradle assembleDebug --no-daemon
    - uses: actions/upload-artifact@v4
      with:
        name: TPZ-Gaming-AI-APK
        path: app/build/outputs/apk/debug/app-debug.apk
