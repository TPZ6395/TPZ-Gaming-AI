name: Build TPZ APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Prepare TPZ App With Logo Bubble & Spinning Ring
      run: |
        rm -rf src *.gradle *.gradle.kts app/*.gradle app/*.gradle.kts gradle.properties
        mkdir -p app/src/main/res/mipmap-xxxhdpi app/src/main/res/drawable
        sudo apt-get update && sudo apt-get install -y imagemagick
        python3 -c 'import glob, subprocess; f=next(iter(glob.glob("logo.*")), ""); f and subprocess.run(["convert", f, "-gravity", "center", "-crop", "1:1", "+repage", "-resize", "512x512", "app/src/main/res/mipmap-xxxhdpi/ic_launcher.png"]) and subprocess.run(["cp", "app/src/main/res/mipmap-xxxhdpi/ic_launcher.png", "app/src/main/res/drawable/tpz_logo.png"])'
        printf "android.useAndroidX=true\n" > gradle.properties
        printf 'pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }\ndependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }\nrootProject.name = "TPZ"\ninclude(":app")\n' > settings.gradle.kts
        printf 'plugins { id("com.android.application") version "8.2.2" apply false; id("org.jetbrains.kotlin.android") version "1.9.22" apply false }\n' > build.gradle.kts
        printf 'plugins { id("com.android.application"); id("org.jetbrains.kotlin.android") }\nandroid { namespace = "com.tpz.assistant"; compileSdk = 34; defaultConfig { applicationId = "com.tpz.assistant"; minSdk = 26; targetSdk = 34; versionCode = 5; versionName = "1.4" }; compileOptions { sourceCompatibility = JavaVersion.VERSION_17; targetCompatibility = JavaVersion.VERSION_17 }; kotlinOptions { jvmTarget = "17" } }\ndependencies { implementation("androidx.core:core-ktx:1.12.0"); implementation("androidx.appcompat:appcompat:1.6.1"); implementation("com.google.android.material:material:1.11.0"); implementation("com.squareup.okhttp3:okhttp:4.12.0"); implementation("org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3") }\n' > app/build.gradle.kts
        printf '' | base64 -d > app/src/main/AndroidManifest.xml
        cat << 'EOF' > app/src/main/java/com/tpz/assistant/TpzSpinnerView.kt
        package com.tpz.assistant
        import android.content.Context
        import android.graphics.*
        import android.view.View
        class TpzSpinnerView(context: Context) : View(context) {
            private var angle = 0f
            private val ringPaint = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                color = Color.parseColor("#2962FF")
                style = Paint.Style.STROKE
                strokeWidth = 10f
                strokeCap = Paint.Cap.ROUND
            }
            private val textPaint = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                color = Color.parseColor("#00E5FF")
                textSize = 36f
                textAlign = Paint.Align.CENTER
                typeface = Typeface.DEFAULT_BOLD
            }
            override fun onDraw(canvas: Canvas) {
                super.onDraw(canvas)
                val cx = width / 2f; val cy = height / 2f; val r = (minOf(width, height) / 2f) - 16f
                canvas.drawArc(cx - r, cy - r, cx + r, cy + r, angle, 270f, false, ringPaint)
                canvas.save(); canvas.rotate(-angle * 0.5f, cx, cy)
                canvas.drawText("TPZ", cx, cy + 12f, textPaint)
                canvas.restore()
                angle = (angle + 8f) % 360f
                postInvalidateOnAnimation()
            }
        }
        EOF
        find app/src -name "*.kt" -exec sed -i 's/val plane = image.planes/val plane = image.planes/g; s/startForeground(101, notification)/if (android.os.Build.VERSION.SDK_INT >= 34) startForeground(101, notification, android.content.pm.ServiceInfo.FOREGROUND_SERVICE_TYPE_MEDIA_PROJECTION or android.content.pm.ServiceInfo.FOREGROUND_SERVICE_TYPE_MICROPHONE) else startForeground(101, notification)/g; s/super.onCreate(savedInstanceState)/super.onCreate(savedInstanceState); try {/g; s/setContentView(layout)/layout.addView(TpzSpinnerView(this), LinearLayout.LayoutParams(160, 160)); setContentView(layout) } catch (e: Exception) { setContentView(TextView(this).apply { text = "Error: " + e.message }) }/g; s/hudLayout.addView(statusText)/val logoBadge = android.widget.ImageView(this).apply { setImageResource(R.drawable.tpz_logo); scaleType = android.widget.ImageView.ScaleType.CENTER_CROP; clipToOutline = true; outlineProvider = android.view.ViewOutlineProvider.OVAL }; hudLayout.addView(logoBadge, android.widget.LinearLayout.LayoutParams(96, 96)); hudLayout.addView(TpzSpinnerView(this), android.widget.LinearLayout.LayoutParams(80, 80)); hudLayout.addView(statusText)/g' {} +
    - uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
    - uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.4'
        build-scan-publish: false
    - run: gradle assembleDebug --no-daemon
    - uses: actions/upload-artifact@v4
      with:
        name: TPZ-Gaming-AI-APK
        path: app/build/outputs/apk/debug/app-debug.apk
