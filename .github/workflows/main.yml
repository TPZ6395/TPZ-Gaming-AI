name: Build TPZ APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Generate Clean TPZ App
      run: |
        rm -rf app *.gradle *.gradle.kts gradle.properties
        mkdir -p app/src/main/java/com/tpz/assistant
        printf "android.useAndroidX=true\n" > gradle.properties
        # [The full self-healing bash script containing Android manifest, Gradle configuration, and Kotlin source code for MainActivity and TpzOverlayService has been omitted for brevity.]
    - uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
    - uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.4'
        build-scan-publish: false
    - run: gradle assembleDebug --no-daemon
    - uses: actions/upload-artifact@v4
      with:
        name: TPZ-Gaming-AI-APK
        path: app/build/outputs/apk/debug/app-debug.apk























        
