name: Build TPZ APK v2.0

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Build Full TPZ v2.0 App
      run: |
        rm -rf src *.gradle *.gradle.kts app/*.gradle app/*.gradle.kts gradle.properties
        mkdir -p app/src/main/res/mipmap-xxxhdpi app/src/main/res/drawable app/src/main/res/font
        sudo apt-get update && sudo apt-get install -y imagemagick curl
        curl -sL "https://github.com/google/fonts/raw/main/ofl/orbitron/Orbitron%5Bwght%5D.ttf" -o app/src/main/res/font/gamer_font.ttf || true
        python3 -c 'import glob, subprocess; f=next(iter(glob.glob("logo.*")), ""); f and subprocess.run(["convert", f, "-gravity", "center", "-crop", "1:1", "+repage", "-resize", "512x512", "app/src/main/res/mipmap-xxxhdpi/ic_launcher.png"]) and subprocess.run(["cp", "app/src/main/res/mipmap-xxxhdpi/ic_launcher.png", "app/src/main/res/drawable/tpz_logo.png"])'
        printf "android.useAndroidX=true\n" > gradle.properties
        printf 'pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }\ndependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }\nrootProject.name = "TPZ"\ninclude(":app")\n' > settings.gradle.kts
        printf 'plugins { id("com.android.application") version "8.2.2" apply false; id("org.jetbrains.kotlin.android") version "1.9.22" apply false }\n' > build.gradle.kts
        printf 'plugins { id("com.android.application"); id("org.jetbrains.kotlin.android") }\nandroid { namespace = "com.tpz.assistant"; compileSdk = 34; defaultConfig { applicationId = "com.tpz.assistant"; minSdk = 26; targetSdk = 34; versionCode = 6; versionName = "2.0" }; compileOptions { sourceCompatibility = JavaVersion.VERSION_17; targetCompatibility = JavaVersion.VERSION_17 }; kotlinOptions { jvmTarget = "17" } }\ndependencies { implementation("androidx.core:core-ktx:1.12.0"); implementation("androidx.appcompat:appcompat:1.6.1"); implementation("com.google.android.material:material:1.11.0"); implementation("com.squareup.okhttp3:okhttp:4.12.0"); implementation("org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3") }\n' > app/build.gradle.kts
        printf '' | base64 -d > app/src/main/AndroidManifest.xml
        find app/src -name "TpzOverlayService.kt" -exec sed -i 's/val plane = image.planes/val plane = image.planes/g; s/startForeground(101, notification)/if (android.os.Build.VERSION.SDK_INT >= 34) startForeground(101, notification, android.content.pm.ServiceInfo.FOREGROUND_SERVICE_TYPE_MEDIA_PROJECTION or android.content.pm.ServiceInfo.FOREGROUND_SERVICE_TYPE_MICROPHONE) else startForeground(101, notification)/g; s/hudLayout.addView(statusText)/val logoBadge = android.widget.ImageView(this).apply { setImageResource(R.drawable.tpz_logo); scaleType = android.widget.ImageView.ScaleType.CENTER_CROP; clipToOutline = true; outlineProvider = android.view.ViewOutlineProvider.OVAL }; hudLayout.addView(logoBadge, android.widget.LinearLayout.LayoutParams(96, 96)); hudLayout.addView(TpzSpinnerView(this), android.widget.LinearLayout.LayoutParams(80, 80)); hudLayout.addView(statusText)/g' {} +
    - uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
    - uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.4'
        build-scan-publish: false
    - run: gradle assembleDebug --no-daemon
    - uses: actions/upload-artifact@v4
      with:
        name: TPZ-Gaming-AI-APK
        path: app/build/outputs/apk/debug/app-debug.apk
